# Shape definitions. Units: metres (any consistent unit works).
# Convention: top-down view, nose along +y, origin at the centre of the shape.
# `length` is the characteristic length: the size of the shape at scale 1.

[defaults.polygon]
edgecolor = "#1B2631"
linewidth = 1.0
zorder = 2

[defaults.circle]
edgecolor = "#1B2631"
linewidth = 1.0
zorder = 3

[gallery]
title = "All shapes"
background = "#FFFFFF"
columns = 4
dpi = 150

# ---------------------------------------------------------------- vehicles

[car]
length = 4.5

[[car.parts]]          # body, nose at +y
kind = "polygon"
facecolor = "#C0392B"
zorder = 2
verts = [[-0.9, -2.25], [0.9, -2.25], [0.9, 1.5], [0.45, 2.25], [-0.45, 2.25], [-0.9, 1.5]]

[[car.parts]]          # windscreen and cabin
kind = "polygon"
facecolor = "#AED6F1"
zorder = 3
verts = [[-0.7, 0.7], [0.7, 0.7], [0.6, -0.9], [-0.6, -0.9]]

[[car.parts]]          # front-left wheel
kind = "polygon"
facecolor = "#1B2631"
zorder = 1
verts = [[-1.15, 1.2], [-0.9, 1.2], [-0.9, 1.9], [-1.15, 1.9]]

[[car.parts]]          # front-right wheel
kind = "polygon"
facecolor = "#1B2631"
zorder = 1
verts = [[0.9, 1.2], [1.15, 1.2], [1.15, 1.9], [0.9, 1.9]]

[[car.parts]]          # rear-left wheel
kind = "polygon"
facecolor = "#1B2631"
zorder = 1
verts = [[-1.15, -1.9], [-0.9, -1.9], [-0.9, -1.2], [-1.15, -1.2]]

[[car.parts]]          # rear-right wheel
kind = "polygon"
facecolor = "#1B2631"
zorder = 1
verts = [[0.9, -1.9], [1.15, -1.9], [1.15, -1.2], [0.9, -1.2]]

